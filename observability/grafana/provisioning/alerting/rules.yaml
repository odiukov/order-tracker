apiVersion: 1
groups:
  - orgId: 1
    name: Order lookups
    folder: Order Tracker
    interval: 10s
    rules:
      - uid: order-lookup-5xx
        title: Order lookup server errors
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Order lookup returned a server error
          description: At least one 5xx response in the last 2 minutes. Inspect correlated logs and traces.
          endpoint: GET /api/orders/{order_id}
          time_window: 2m
          dashboard_url: http://localhost:3000/d/order-tracker
          __dashboardUid__: order-tracker
          __panelId__: '2'
        labels:
          service: order-tracker
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              expr: sum(increase(http_server_requests_total{service_name="order-tracker",http_route="/api/orders/{order_id}",http_response_status_code=~"5.."}[2m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: classic_conditions
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  type: query
