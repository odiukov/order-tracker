name: order-tracker

services:
  app:
    image: order-tracker:${ORDER_TRACKER_TAG:-local}
    build: .
    ports:
      - "127.0.0.1:${ORDER_TRACKER_PORT:-8000}:8000"
    environment:
      ORDER_DB_PATH: /data/orders.db
      TELEMETRY_EXPORTER: ${TELEMETRY_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    depends_on:
      collector:
        condition: service_started
    volumes:
      - orders:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12

  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:13133:13133"
    depends_on: [loki, tempo]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      retries: 20

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 5s
      retries: 20

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [prometheus, loki, tempo]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      retries: 30

volumes:
  orders:
  prometheus:
  loki:
  tempo:
  grafana:

networks:
  default:
    ipam:
      config:
        - subnet: ${ORDER_TRACKER_SUBNET:-10.215.24.0/24}
